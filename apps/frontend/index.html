<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app fills the screen under notches/home indicators when installed -->

      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>VEERHA WMS - Warehouse Management System</title>
    <meta
      name="description"
      content="Veerha WMS — warehouse operations, putaway, picking and stock management. Installable on the warehouse floor."

    <meta name="author" content="VEERHA" />

    <!-- PWA -->
    <meta name="theme-color" content="#0f1729" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Veerha WMS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
