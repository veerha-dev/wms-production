services:
  - type: web
    name: veerha-wms-backend
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Prompt user for Neon database URL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure random secret key
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render will automatically generate a secure random secret key
      - key: CORS_ORIGIN
        sync: false # Set in dashboard to the real frontend origins, comma-separated, e.g. https://app-veerha.pages.dev,https://veerha-admin.pages.dev plus any custom domain
      - key: APP_URL
        sync: false # Public frontend URL used in emails, e.g. https://app-veerha.pages.dev
      - key: SMTP_HOST
        sync: false # Leave empty to disable email (EmailService becomes a no-op)
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false # "true" for port 465, "false" for 587/STARTTLS
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false # e.g. "Veerha WMS <noreply@veerha.com>"
