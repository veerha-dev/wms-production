name: Deploy Veerha WMS

on:
  push:
    branches: [main]

jobs:
  # ─── Backend → Render ───────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          # Without these the curl below builds a nonsense URL, gets a 401, and
          # the job still passes — a green tick that deployed nothing. Fail loudly.
          if [ -z "${RENDER_SERVICE_ID}" ] || [ -z "${RENDER_API_KEY}" ]; then
            echo "::error::RENDER_SERVICE_ID and/or RENDER_API_KEY are not set."
            echo "Set them under Settings > Secrets and variables > Actions,"
            echo "or delete this job if Render deploys via its own GitHub integration."
            exit 1
          fi

          status=$(curl -sS -o /tmp/render.json -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          cat /tmp/render.json
          echo

          # Render answers 201 on a queued deploy.
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "::error::Render deploy request failed with HTTP ${status}"
            exit 1
          fi
          echo "Render deploy queued (HTTP ${status})."

  # ─── Frontend → Cloudflare Pages ────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=apps/frontend --legacy-peer-deps

      - name: Build frontend
        working-directory: apps/frontend
        env:
          VITE_API_MODE: real
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=app-veerha --branch=main

  # ─── Super Admin → Cloudflare Pages ─────────────────────────────────────────
  deploy-super-admin:
    name: Deploy Super Admin (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=apps/super-admin --legacy-peer-deps

      - name: Build super-admin
        working-directory: apps/super-admin
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/super-admin/dist --project-name=superadmin-veerha --branch=main
